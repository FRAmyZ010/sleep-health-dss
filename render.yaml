# Render Blueprint — free public demo for course review
# Dashboard: New → Blueprint → connect this repo
services:
  - type: web
    name: sleep-health-dss
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: HOST
        value: "0.0.0.0"
